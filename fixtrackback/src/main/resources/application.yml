# Detrás de un proxy inverso usar server.forward-headers-strategy: native (Tomcat solo confía en IPs privadas);
# no usar framework: aceptaría un X-Forwarded-For falso y permitiría saltarse el límite de intentos por IP
spring:
  application:
    name: fixtrackback
  # Carga las variables del archivo .env local si existe
  config:
    import: optional:file:.env[.properties]
  # Crea la base fixtrack al arrancar si no existe en el equipo; ddl-auto crea luego las tablas
  datasource:
    url: jdbc:mysql://localhost:3306/fixtrack?serverTimezone=America/Bogota&createDatabaseIfNotExist=true
    username: root
    password: Coloresdelamor123*
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # update solo en desarrollo; en producción DDL_AUTO=validate
      ddl-auto: update
    # SQL en la consola solo si SHOW_SQL=true (para depurar); apagado por defecto para no llenar el log
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Bogota
  jackson:
    time-zone: America/Bogota
    # Rechaza decimales en campos enteros (por ejemplo, cantidad 1.5) en lugar de truncarlos
    deserialization:
      accept-float-as-int: false
  # Idioma fijo para que los mensajes de Bean Validation salgan en español
  web:
    locale: es_CO
    locale-resolver: fixed

fixtrack:
  # Administrador que se crea al arrancar solo si no hay ninguno activo
  admin:
    email: admin@fixtrack.local
    password: Admin123*
    full-name: Administrador
    document-type: CC
    document-number: 0000000000
  # Catálogos, clientes y órdenes de ejemplo para desarrollo; solo con SEED_DATA=true y DEMO_USERS_PASSWORD
  seed-data: false
  # Usuarios de prueba por rol para desarrollo; se crean solo si DEMO_USERS_PASSWORD tiene valor
  demo-users:
    password: demo1234*
    users:
      - email: coordinador@fixtrack.local
        full-name: Coordinador de Prueba
        role: COORDINATOR
        document-type: CC
        document-number: "1000000001"
      - email: asesor.prueba@fixtrack.local
        full-name: Asesor de Prueba
        role: ADVISOR
        document-type: CC
        document-number: "1000000002"
      - email: tecnico@fixtrack.local
        full-name: Técnico de Prueba
        role: TECHNICIAN
        document-type: CC
        document-number: "1000000003"
  # Orígenes del front separados por coma (por ejemplo https://fixtrack.midominio.co)
  cors:
    allowed-origins: http://localhost:5173
  # Dirección del portal del cliente que se imprime en el comprobante de ingreso
  portal-url: http://localhost:5173/consulta
  # Llave AES de 32 bytes en Base64 para cifrar la contraseña o patrón de desbloqueo
  encryption-key: kGBNTm18L6XChRoZlDJvP8dC6aXRgck2hPqGBm8ww58=
  # Token de sesión: llave HMAC de al menos 32 bytes en Base64 y duración (por ejemplo 8h o 30m)
  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWZ=
    expiration: 8h
