spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fixtrack?serverTimezone=America/Bogota&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true

app:
  encryption:
    key: ${ENCRYPTION_KEY}
  jwt:
    secret: ${JWT_SECRET}
    expiration: 8h
  admin:
    password: ${ADMIN_PASSWORD}
    email: admin@fixtrack.local
    document-number: 1000000000
  demo:
    users:
      password: ${DEMO_USERS_PASSWORD}
  seed:
    data: ${SEED_DATA:false}
